name: mge_pipeline
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.10
  - pip
  
  # Annotation
  - prokka>=1.14
  - bakta>=1.8
  
  # Plasmid detection
  - mob-suite>=3.0
  - plasmidfinder>=2.1
  
  # IS elements
  - isescan>=1.7
  
  # Integrons
  - integron_finder>=2.0
  
  # Prophage
  - phispy>=4.0
  - blast>=2.12
  
  # General bioinformatics
  - bedtools>=2.30
  - biopython>=1.79
  - hmmer>=3.3
  - cd-hit>=4.8
  
  # Utilities
  - trnascan-se>=2.0
  - repeatmasker>=4.1
  - abricate>=1.0
  - rgi>=6.0
  
  # Development & analysis
  - pandas>=1.3
  - numpy>=1.21
  - scipy>=1.7
  - matplotlib>=3.4
  - seaborn>=0.11
  
  # System
  - parallel>=20210822
  - bc>=1.07
  
  - pip:
    - biopython>=1.79
    - pandas>=1.3
    - numpy>=1.21
    - matplotlib>=3.4
