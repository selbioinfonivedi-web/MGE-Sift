version: '3.8'

services:
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mgesift
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: 
      context: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - shared_data:/tmp
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:postgrespassword@database/mgesift
      - CELERY_BROKER_URL=redis://redis:6379/0

  celery_worker:
    build: 
      context: ./backend
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./backend:/app
      - ./workflows:/workflows  # Needs access to run Nextflow
      - shared_data:/tmp
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:postgrespassword@database/mgesift
      - CELERY_BROKER_URL=redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app

volumes:
  pgdata:
  shared_data:
