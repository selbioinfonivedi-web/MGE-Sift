#!/bin/bash
# MGE Detection Pipeline Configuration
# Last updated: 2026-06-22

################################################################################
# ENVIRONMENT & PATHS
################################################################################
PIPELINE_HOME="/path/to/MGE_Bio"
CONDA_ENV="mge_pipeline"
CONDA_PATH=$(conda info --base)

# Tool paths (auto-resolved from conda env if available)
PROKKA_BIN="prokka"
BAKTA_BIN="bakta"
PLASMIDFINDER_BIN="plasmidfinder"
MOB_SUITE_BIN="mob_suite"
ISESCAN_BIN="isescan.py"
INTEGRON_FINDER_BIN="integron_finder"
PHISPY_BIN="phispy.py"
BLAST_BIN="blastn"
BEDTOOLS_BIN="bedtools"
TRNASCAN_BIN="tRNAscan-SE"
RGI_BIN="rgi"
ABRICATE_BIN="abricate"

# Database paths
MOB_DB="/path/to/mob_db"
ISESCAN_DB="/path/to/isescan/IS_euk"
ISESCAN_HMMER_DB="/path/to/isescan/Hmmscan.pl"
INTEGRON_DB="/path/to/integron_finder/data"
PHISPY_DB="/path/to/phispy/phages.phmm"
CARD_DB="/path/to/card/card.json"
CARD_KMERS="/path/to/card/card.kmers"
RESFINDER_DB="/path/to/resfinder"
PLASMIDFINDER_DB="/path/to/plasmidfinder/plasmids"
ISLANDPATH_DB="/path/to/islandpath"

################################################################################
# ANNOTATION PARAMETERS
################################################################################
ANNOTATION_TOOL="prokka"  # or "bakta"
ANNOTATION_KINGDOM="Bacteria"
ANNOTATION_CPUS=4
ANNOTATION_METAGENOME=0  # Set to 1 for metagenomic assemblies

################################################################################
# PLASMID DETECTION
################################################################################
MOB_STRICT=1              # 1=strict (full replicon), 0=lenient
PLASMIDFINDER_IDENTITY=0.90
PLASMIDFINDER_MIN_LENGTH=300

################################################################################
# IS ELEMENT DETECTION
################################################################################
ISESCAN_MIN_LENGTH=100
ISESCAN_MIN_IDENTITY=0.60
ISESCAN_E_VALUE=1e-05

# TSD (Target Site Duplication) detection parameters
TSD_MIN_LENGTH=2
TSD_MAX_LENGTH=14
TSD_MAX_DISTANCE=50  # Max bp between inverted repeats and TSD sites

################################################################################
# INTEGRON DETECTION
################################################################################
INTEGRON_FINDER_LOCAL=1  # Use local search (faster for large genomes)
INTEGRON_MIN_LENGTH=300
INTEGRON_MAX_EVALUE=0.001
INTEGRON_MIN_ATTC=1      # Minimum attC sites to call integron

################################################################################
# PROPHAGE DETECTION
################################################################################
PHISPY_E_VALUE=0.0001
PHISPY_MIN_SCORE=10
PHASTER_ENABLED=1         # Also run PHASTER for comparison
PHASTER_EMAIL="user@example.com"

################################################################################
# GENOMIC ISLAND DETECTION
################################################################################
ISLANDPATH_ENABLED=1
ALIEN_HUNTER_ENABLED=1
SIGI_HMM_ENABLED=1

# GC content thresholds (in deviation %)
GC_THRESHOLD_ACQUIRED=5   # > 5% deviation from genome mean = potential HGT
GC_THRESHOLD_AMBIGUOUS=2  # 2-5% = ambiguous

ISLAND_MIN_LENGTH=3000    # Minimum island size

################################################################################
# HGT & CODON BIAS DETECTION
################################################################################
CAI_ENABLED=1             # Codon Adaptation Index
SIGI_HMM_WINDOW=400
ALIEN_HUNTER_WINDOW=9
ALIEN_HUNTER_MIN_IVOM=10  # Min IVOM score

################################################################################
# REPEAT DETECTION
################################################################################
REPEAT_FINDER="einverted"  # or "RepeatMasker" (slower)
REPEAT_MIN_LENGTH=20       # Minimum repeat size
REPEAT_IDENTITY=0.80

################################################################################
# AMR DETECTION
################################################################################
RGI_ALIGNMENT="BLAST"      # or "DIAMOND" (faster)
RGI_COVERAGE=0.80
RGI_IDENTITY=0.80
ABRICATE_IDENTITY=0.80
ABRICATE_COVERAGE=0.80
ABRICATE_DATABASES="ncbi,card,resfinder,argannot"

################################################################################
# CLASSIFICATION & SCORING
################################################################################
IS_SCORE_INTACT_TRANSPOSASE=2
IS_SCORE_TSDs=2
IS_SCORE_MULTIPLE_COPIES=1
IS_SCORE_RECENT_BLAST=1
IS_SCORE_TRUNCATED=-2
IS_SCORE_SINGLE_NO_TSD=-1
IS_THRESHOLD_ACQUIRED=3
IS_THRESHOLD_AMBIGUOUS=1

################################################################################
# OUTPUT & REPORTING
################################################################################
OUTPUT_DIR="./results"
REPORT_TIMESTAMP=1        # Include timestamp in filenames
REPORT_FORMAT="tsv"       # or "csv"
REPORT_INCLUDE_COORDS=1   # Include genomic coordinates in output

################################################################################
# COMPUTATIONAL RESOURCES
################################################################################
MAX_CPUS=8
MAX_MEMORY_GB=32
PARALLEL_SAMPLES=4        # For batch mode

################################################################################
# QUALITY CONTROL
################################################################################
MIN_GENOME_SIZE=10000     # Minimum assembly size (bp)
MAX_GENOME_SIZE=20000000  # Maximum assembly size (bp)
MIN_CONTIG_LENGTH=500     # Discard contigs shorter than this
CHECKSUM_VALIDATION=1     # Validate input files
CLEANUP_INTERMEDIATE=0    # Delete temp files (1=yes, 0=keep for debugging)

################################################################################
# LOGGING & DEBUG
################################################################################
LOG_LEVEL="INFO"          # DEBUG, INFO, WARNING, ERROR
LOG_DIR="./logs"
DEBUG_MODE=0              # 1=verbose output, 0=standard
SAVE_INTERMEDIATES=1      # Keep blast results, hmmer hits, etc.
