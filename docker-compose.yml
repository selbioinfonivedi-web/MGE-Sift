# Docker Compose configuration for production deployment

services:
  # Core Nextflow pipeline service
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: mge-sift-pipeline:2.0.0
    container_name: mge-pipeline
    environment:
      NEXTFLOW_HOME: /opt/nextflow
      NXF_WORK: /workspace/work
      NXF_SINGULARITY_CACHEDIR: /workspace/.singularity
    volumes:
      - ./genomes:/workspace/genomes:ro
      - ./results:/workspace/results
      - ./config:/workspace/config:ro
      - ./databases:/workspace/databases:ro
      - nextflow_cache:/workspace/work
    networks:
      - mge-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ls", "-la", "/workspace/results"]
      interval: 60s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: mge-sift-api:2.0.0
    container_name: mge-api
    command: python -m uvicorn python.api_server:app --host 0.0.0.0 --port 8000 --reload
    environment:
      MGE_DB_PATH: /data/mge_results.db
      MGE_API_KEY: ${MGE_API_KEY:-change-me-in-production}
    volumes:
      - ./results:/data:ro
      - ./python:/app/python:ro
      - api_data:/data
    ports:
      - "8000:8000"
    networks:
      - mge-network
    depends_on:
      - pipeline
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3


  # PostgreSQL option for larger deployments
  postgres:
    image: postgres:15-alpine
    container_name: mge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mge_results}
      POSTGRES_USER: ${POSTGRES_USER:-mge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mge-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - prod-pg  # Only start with: docker-compose --profile prod-pg up

  # Vue.js Web UI
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://api:8000}
    image: mge-sift-web:2.0.0
    container_name: mge-web
    environment:
      VITE_API_URL: http://api:8000
    ports:
      - "3000:3000"
    networks:
      - mge-network
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mge-network:
    driver: bridge

volumes:
  nextflow_cache:
    driver: local
  api_data:
    driver: local

  postgres_data:
    driver: local
