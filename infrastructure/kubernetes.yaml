# GCP Deployment Configuration
# Deploy MGE-Sift to Google Cloud Run and Cloud Storage

apiVersion: v1
kind: ConfigMap
metadata:
  name: mge-sift-config
  namespace: default
data:
  PIPELINE_VERSION: "2.0.0"
  API_TIMEOUT: "300"
  LOG_LEVEL: "INFO"
  DATABASE_TYPE: "postgresql"

---
apiVersion: v1
kind: Secret
metadata:
  name: mge-sift-secrets
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres-service:5432/mge_results"
  API_KEY: "your-secure-api-key"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mge-sift-api
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mge-sift-api
  template:
    metadata:
      labels:
        app: mge-sift-api
    spec:
      containers:
      - name: api
        image: gcr.io/your-project/mge-sift:2.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: mge-sift-config
        - secretRef:
            name: mge-sift-secrets
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: results-volume
          mountPath: /data
      volumes:
      - name: results-volume
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: mge-sift-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: mge-sift-api
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mge-sift-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mge-sift-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
